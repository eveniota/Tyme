<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tyme</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      width: 260px;
      padding: 14px;
      background: #0f0f11;
      color: #e4e4e7;
      font-size: 13px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: -0.3px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #71717a;
    }

    .dot.active {
      background: #22c55e;
      box-shadow: 0 0 6px #22c55e;
    }

    .status {
      font-size: 11px;
      color: #a1a1aa;
      max-width: 140px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .total-section {
      padding: 8px 0 12px;
      border-bottom: 1px solid #27272a;
      margin-bottom: 12px;
    }

    .total-label {
      font-size: 10px;
      color: #71717a;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .total-time {
      font-size: 20px;
      font-weight: 700;
      color: #fafafa;
      margin-top: 2px;
      font-variant-numeric: tabular-nums;
    }

    ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 200px;
      overflow-y: auto;
    }

    .site-row {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .site-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .site-domain {
      font-weight: 400;
      max-width: 170px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #d4d4d8;
    }

    .site-time {
      color: #a1a1aa;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .bar-bg {
      height: 3px;
      background: #27272a;
      border-radius: 2px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: #6366f1;
      border-radius: 2px;
    }

    .empty {
      color: #71717a;
      font-size: 12px;
      text-align: center;
      padding: 12px 0;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span id="status-dot" class="dot"></span>
      <span>Tyme</span>
    </div>
    <span id="status-text" class="status">Idle</span>
  </header>

  <div class="total-section">
    <div class="total-label">Today</div>
    <div id="total-time" class="total-time">0s</div>
  </div>

  <ul id="domain-list">
    <li class="empty">No activity today</li>
  </ul>

  <script src="popup.js"></script>
</body>
</html>
